name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 pandas openpyxl python-dotenv supabase pyinstaller

    - name: Build EXE
      run: |
        pyinstaller --noconsole --onefile --name "BookManager" --icon=icon.ico --hidden-import=config --hidden-import=db --hidden-import=utils app.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: BookManager-Windows
        path: dist/BookManager.exe
